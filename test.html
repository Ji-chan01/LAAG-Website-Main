<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Text Animation</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #222;
            gap: 10px;
        }

        .btn {
            position: relative;
            overflow: hidden;
            width: 150px;
            height: 50px;
            border: none;
            background-color: #007bff;
            color: white;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
        }

        .btn span {
            position: absolute;
            width: 100%;
            text-align: center;
            transition: transform 0.4s ease, opacity 0.4s ease;
        }

        .btn .text1 {
            left: 0;
        }

        .btn .text2 {
            left: -100%;
            opacity: 0;
        }

        /* On button click, all buttons should change */
        .btn.clicked .text1 {
            transform: translateX(-100%);
            opacity: 0;
        }

        .btn.clicked .text2 {
            transform: translateX(100%);
            opacity: 1;
        }
    </style>
</head>
<body>

    <button class="btn" onclick="toggleAllTexts()">
        <span class="text1">Click Me</span>
        <span class="text2">Hello!</span>
    </button>

    <button class="btn" onclick="toggleAllTexts()">
        <span class="text1">Press Me</span>
        <span class="text2">Hi!</span>
    </button>

    <button class="btn" onclick="toggleAllTexts()">
        <span class="text1">Tap Me</span>
        <span class="text2">Welcome!</span>
    </button>

    <script>
        function toggleAllTexts() {
            let buttons = document.querySelectorAll(".btn");
            buttons.forEach(button => {
                button.classList.toggle("clicked");
            });
        }
    </script>

</body>
</html>
