<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested Bullet Points</title>
    <style>
        ul {
            list-style-type: disc; /* Ensures bullets are visible */
        }
        ul ul {
            list-style-type: circle; /* Different bullet style for sub-list */
            margin-left: 20px; /* Indentation for nested list */
        }
        ul ul ul {
            list-style-type: square; /* Another style for deeper levels */
        }
    </style>
</head>
<body>

    <ul>
        <li>Main Bullet 1</li>
        <li>Main Bullet 2
            <ul>
                <li>Sub Bullet 2.1</li>
                <li>Sub Bullet 2.2
                    <ul>
                        <li>Sub-Sub Bullet 2.2.1</li>
                        <li>Sub-Sub Bullet 2.2.2</li>
                    </ul>
                </li>
            </ul>
        </li>
        <li>Main Bullet 3</li>
    </ul>

</body>
</html>
