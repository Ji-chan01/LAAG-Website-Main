<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAAG: An All-Rounder Tourism Website For The Promotion Of Masbate's Tourist Spots</title>

    <link rel="stylesheet" href="./assets/styles/header.css">
    <link rel="stylesheet" href="./assets/styles/signup.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>

<body>
  <nav>
    <div class="leftsection">
      <img src="./assets/Backgrounds/lowgo.png" alt="" class="logo">
      <h3>LAAG - TOURISM INC.</h3>
    </div>
    <div class="rightsection">
      <div class="three-dots">
        <span></span>
      </div>
      <ul>
        <li><a href="index.html">HOME</a></li>
        <li><a href="signupfillupform.html">LOG IN/SIGN UP</a></li>
        <li><a href="contact.html">CONTACT</a></li>
        <li><a href="about.html">ABOUT</a></li>
      </ul>
    </div>
  </nav>
     <div class="wrapper">
         <form action="">
          <h1>Sign Up</h1>
          <div class="prev active">
            <div class="input-box">
                <input type="text" placeholder="First Name"
                required>
                <i class="bx bxs-user"></i>
            </div>
            <div class="input-box">
                <input type="text" placeholder="Last Name"
                required>
                <i class="bx bxs-user"></i>
            </div>
            <a id="nextBtn" class="button">Next</a>
          </div>

            <div class="next">
              <div class="input-box">
                <input type="text" placeholder="Email"
                required>
                <i class="bx bxs-user"></i>
              </div>
              <div class="input-box">
                  <input type="text" placeholder="Contact"
                  required>
                  <i class="bx bxs-phone"></i>
              </div>
              <div class="input-box">
                  <input type="password" placeholder="Password"
                  required>
                  <i class="bx bxs-lock-alt"></i>
              </div>
              <div class="input-box">
                  <input type="password" placeholder="Confirm Password"
                  required>
                  <i class="bx bxs-lock-alt"></i>
              </div>

              <a id="registerBtn" href="login.html" class="button">SIGN UP</a>
            </div>
            <div class="register-link">
              <p>Already have an account? <a class="loginBtn" href="login.html">Login</a></p>
          </div>
         </form>
     </div>

     <script src="./assets/scripts/nav.js"></script>
     <script src="./assets/scripts/signup.js"></script>
</body>
</html>
